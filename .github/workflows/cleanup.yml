name: Delete Old Releases

on:
  workflow_dispatch:

jobs:
  delete_releases:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.rest.repos.listReleases({ owner, repo });
            
            for (const release of releases.data) {
              if (release.tag_name !== 'v2.0.6-pre.1') {
                console.log(`Deleting release: ${release.tag_name}`);
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: release.id
                });
                
                // Optionally delete the tag as well
                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `tags/${release.tag_name}`
                  });
                  console.log(`Deleted tag: ${release.tag_name}`);
                } catch (e) {
                  console.log(`Could not delete tag: ${release.tag_name} - ${e.message}`);
                }
              }
            }
