<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameUnlocker Manager</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --heading-color: #111111;
            --card-bg: #f9f9f9;
            --card-border: #e0e0e0;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --btn-bg: #ffffff;
            --btn-hover: #f0f0f0;
            --pre-bg: #f4f4f4;
            --pre-text: #555;
            --danger-color: #e74c3c;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #e0e0e0;
                --heading-color: #ffffff;
                --card-bg: #1e1e1e;
                --card-border: #333333;
                --input-bg: #2d2d2d;
                --input-border: #444444;
                --btn-bg: #2d2d2d;
                --btn-hover: #3d3d3d;
                --pre-bg: #1a1a1a;
                --pre-text: #a0a0a0;
            }
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-color); color: var(--text-color); padding: 20px; line-height: 1.6; }
        h1 { color: var(--heading-color); text-align: center; font-size: 24px; font-weight: 600; margin-bottom: 30px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--card-border); }
        h3 { margin-top: 0; font-size: 16px; color: var(--text-color); }
        select, input { padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 12px; border-radius: 4px; border: 1px solid var(--input-border); font-size: 14px; background: var(--input-bg); color: var(--text-color); }
        button { padding: 10px 16px; border: 1px solid var(--card-border); border-radius: 4px; background: var(--btn-bg); color: var(--text-color); font-weight: 500; cursor: pointer; width: 100%; font-size: 14px; margin-bottom: 10px; transition: background 0.2s; }
        button:hover { background: var(--btn-hover); }
        button.bug { color: #e67e22; border-color: #fdebd0; margin-top: 10px; }
        button.bug:hover { background: #fef5e7; }
        .profile-section { margin-top: 15px; border-top: 1px solid var(--card-border); padding-top: 15px; }
        .profile-title { font-weight: bold; margin-bottom: 10px; color: var(--heading-color); }
        .pkg-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: var(--pre-bg); border-radius: 4px; margin-bottom: 5px; font-size: 13px; font-family: monospace; border: 1px solid var(--card-border); }
        .remove-btn { background: none; border: none; color: var(--danger-color); cursor: pointer; padding: 4px 8px; font-size: 12px; font-weight: bold; width: auto; margin: 0; }
        .remove-btn:hover { background: rgba(231, 76, 60, 0.1); }
    </style>
</head>
<body>
    <h1>GameUnlocker Setup</h1>
    
    <div class="card">
        <h3>Add New Game</h3>
        <select id="profileSelect">
            <option value="PACKAGES_SAMSUNG_S24_ULTRA">Samsung Galaxy S24 Ultra (Best for most games)</option>
            <option value="PACKAGES_REDMAGIC_9_PRO">RedMagic 9 Pro (Best for COD/Brawl Stars)</option>
            <option value="PACKAGES_XIAOMI_11T_PRO">Xiaomi 11T Pro</option>
            <option value="PACKAGES_PIXEL_9_PRO">Google Pixel 9 Pro (Best for Genshin)</option>
            <option value="cpu_spoof_with_cpu">CPU Spoof Only (Fortnite/Apex)</option>
        </select>
        <div id="appListContainer" style="max-height: 200px; overflow-y: auto; border: 1px solid var(--input-border); border-radius: 4px; padding: 10px; margin-bottom: 12px; background: var(--input-bg); font-size: 14px;">
            Loading installed apps...
        </div>
        <button onclick="addSelectedGames()">Inject Selected Apps to Config</button>
        <button class="bug" onclick="reportBug()">🐛 Report Bug (Auto-Attach Logs)</button>
    </div>
    
    <div class="card">
        <h3>Current Target Apps</h3>
        <button onclick="loadConfig()">Reload List</button>
        <div id="configView">Loading...</div>
    </div>

    <script>
        const configPath = "/data/adb/modules/Game-Unlocker/config.json";

        async function execShell(cmd) {
            if (typeof ksu !== 'undefined' && ksu.exec) {
                return await ksu.exec(cmd);
            } else if (typeof apatch !== 'undefined' && apatch.exec) {
                return await apatch.exec(cmd);
            } else if (typeof mmrl !== 'undefined') {
                return { errno: 0, stdout: "MMRL", stderr: "" };
            }
            return null; 
        }

        function renderProfile(title, packages) {
            if (!packages || packages.length === 0) return '';
            let html = `<div class="profile-section"><div class="profile-title">${title}</div>`;
            packages.forEach(pkg => {
                html += `<div class="pkg-item"><span>${pkg}</span> <button class="remove-btn" onclick="removeGame('${pkg}')">✖</button></div>`;
            });
            html += `</div>`;
            return html;
        }

        async function loadConfig() {
            try {
                let stdout = "";
                let shell = await execShell(`cat ${configPath}`);
                
                if (shell !== null) {
                    if (shell.errno === 0) stdout = shell.stdout;
                } else {
                    try {
                        let res = await fetch('/cgi-bin/api.sh?action=get_config');
                        stdout = await res.text();
                    } catch (fetchErr) {
                        stdout = '{"PACKAGES_SAMSUNG_S24_ULTRA":["com.example.game"]}';
                    }
                }

                if (stdout) {
                    const cfg = JSON.parse(stdout);
                    window.currentConfig = cfg;
                    
                    let html = "";
                    html += renderProfile("Samsung S24 Ultra", cfg.PACKAGES_SAMSUNG_S24_ULTRA);
                    html += renderProfile("RedMagic 9 Pro", cfg.PACKAGES_REDMAGIC_9_PRO);
                    html += renderProfile("Xiaomi 11T Pro", cfg.PACKAGES_XIAOMI_11T_PRO);
                    html += renderProfile("Pixel 9 Pro", cfg.PACKAGES_PIXEL_9_PRO);
                    
                    if(cfg.cpu_spoof && cfg.cpu_spoof.with_cpu) {
                        html += renderProfile("CPU Spoof Only", cfg.cpu_spoof.with_cpu);
                    }
                    if(cfg.cpu_spoof && cfg.cpu_spoof.blacklist) {
                        html += renderProfile("Blacklisted Apps", cfg.cpu_spoof.blacklist);
                    }

                    document.getElementById('configView').innerHTML = html || "No games configured.";
                    
                    if (window.installedAppsList) {
                        renderAppList();
                    }
                } else {
                    document.getElementById('configView').innerText = "Error reading config.json";
                }
            } catch (e) {
                document.getElementById('configView').innerText = "Failed to load config.";
            }
        }

        async function addSelectedGames() {
            const profile = document.getElementById('profileSelect').value;
            const checkboxes = document.querySelectorAll('.app-checkbox:checked');
            
            if (checkboxes.length === 0) {
                alert('Please select at least one app!');
                return;
            }

            let successCount = 0;
            for (let checkbox of checkboxes) {
                const pkg = checkbox.value;
                try {
                    let shell = null;
                    if(profile === "cpu_spoof_with_cpu") {
                        shell = await execShell(`sed -i '/"with_cpu": \\\[/a \\    "${pkg}",' ${configPath}`);
                    } else {
                        shell = await execShell(`sed -i 's/"${profile}": \\\[/"${profile}": \\\[\\n    "${pkg}",/' ${configPath}`);
                    }
                    
                    let success = false;
                    if (shell !== null) {
                        success = (shell.errno === 0);
                    } else {
                        let actualProfile = profile === "cpu_spoof_with_cpu" ? "with_cpu" : profile;
                        let res = await fetch(`/cgi-bin/api.sh?action=add_game&pkg=${pkg}&profile=${actualProfile}`);
                        let data = await res.json();
                        success = data.success;
                    }
                    if (success) successCount++;
                } catch (e) {}
            }

            if (successCount > 0) {
                alert(`Successfully added ${successCount} apps!\\nReboot to apply changes.`);
                loadConfig();
            } else {
                alert('Failed to modify config.');
            }
        }

        async function removeGame(pkg) {
            if(!confirm(`Remove ${pkg} from configuration?`)) return;
            try {
                let success = false;
                let shell = await execShell(`sed -i '/"${pkg}"/d' ${configPath}`);
                
                if (shell !== null) {
                    success = (shell.errno === 0);
                } else {
                    let res = await fetch('/cgi-bin/api.sh?action=remove_game&pkg=' + pkg);
                    let data = await res.json();
                    success = data.success;
                }

                if (success) {
                    loadConfig();
                } else {
                    alert('Failed to remove game.');
                }
            } catch (e) {
                alert('API error.');
            }
        }

        async function reportBug() {
            let model = "Unknown";
            let android = "Unknown";
            let logSnippet = "No recent logs found.";
            let configDump = JSON.stringify(window.currentConfig || {}, null, 2);

            try {
                let mShell = await execShell('getprop ro.product.model');
                if (mShell && mShell.errno === 0) {
                    model = mShell.stdout.trim();
                    let aShell = await execShell('getprop ro.build.version.release');
                    if (aShell && aShell.errno === 0) android = aShell.stdout.trim();

                    await execShell('logcat -d -s GameUnlocker > /sdcard/Download/GameUnlocker_Logs.txt');
                    let logShell = await execShell('logcat -d -s GameUnlocker -t 20');
                    if (logShell && logShell.errno === 0 && logShell.stdout.trim() !== "") {
                        logSnippet = logShell.stdout.trim();
                    }
                } else {
                    let resInfo = await fetch('/cgi-bin/api.sh?action=get_device_info');
                    if (resInfo.ok) {
                        let dataInfo = await resInfo.json();
                        if (dataInfo.success) {
                            model = dataInfo.model;
                            android = dataInfo.android;
                        }
                    }
                    let resLogs = await fetch('/cgi-bin/api.sh?action=generate_logs');
                    if (resLogs.ok) {
                        let dataLogs = await resLogs.json();
                        if (dataLogs.success) {
                            logSnippet = atob(dataLogs.snippet);
                        }
                    }
                }
            } catch (e) {}

            const issueBody = `### 🐛 Bug Description\n\n### 🔄 Steps to Reproduce\n1. \n2. \n3. \n\n### 📱 Device Information\n- **Model:** ${model}\n- **Android Version:** ${android}\n\n---\n### 🛠 Diagnostics\n\n> [!IMPORTANT]\n> 📂 **A full log file has been saved to your phone at \`/sdcard/Download/GameUnlocker_Logs.txt\`. Please drag and drop that file anywhere in this text box to attach it!**\n\n<details>\n<summary><b>Show Recent Log Snippet</b></summary>\n\n\`\`\`log\n${logSnippet}\n\`\`\`\n</details>\n\n<details>\n<summary><b>Show Configuration Dump</b></summary>\n\n\`\`\`json\n${configDump}\n\`\`\`\n</details>`;
            const encodedBody = encodeURIComponent(issueBody);
            const githubUrl = `https://github.com/yadavnikhil03/GameUnlocker/issues/new?title=Bug+Report:+[Brief+Title+Here]&body=${encodedBody}`;
            window.open(githubUrl, '_blank');
        }

        function isAppConfigured(pkg) {
            const cfg = window.currentConfig;
            if (!cfg) return false;
            let allConfigured = [];
            if(cfg.PACKAGES_SAMSUNG_S24_ULTRA) allConfigured.push(...cfg.PACKAGES_SAMSUNG_S24_ULTRA);
            if(cfg.PACKAGES_REDMAGIC_9_PRO) allConfigured.push(...cfg.PACKAGES_REDMAGIC_9_PRO);
            if(cfg.PACKAGES_XIAOMI_11T_PRO) allConfigured.push(...cfg.PACKAGES_XIAOMI_11T_PRO);
            if(cfg.PACKAGES_PIXEL_9_PRO) allConfigured.push(...cfg.PACKAGES_PIXEL_9_PRO);
            if(cfg.cpu_spoof && cfg.cpu_spoof.with_cpu) allConfigured.push(...cfg.cpu_spoof.with_cpu);
            return allConfigured.includes(pkg);
        }

        function renderAppList() {
            const container = document.getElementById('appListContainer');
            if (!window.installedAppsList) return;
            
            let html = "";
            let count = 0;
            window.installedAppsList.forEach(app => {
                if (!isAppConfigured(app.package)) {
                    html += `<label style="display:block; margin-bottom: 5px; cursor: pointer;">
                        <input type="checkbox" class="app-checkbox" value="${app.package}"> 
                        <b>${app.name}</b> <span style="color:#888; font-size:11px;">(${app.package})</span>
                    </label>`;
                    count++;
                }
            });
            
            if (count === 0) {
                html = "All installed apps are already configured!";
            }
            container.innerHTML = html;
        }

        async function fetchApps() {
            try {
                let appsObj = null;
                let shell = await execShell('export QUERY_STRING="action=get_apps"; sh /data/adb/modules/Game-Unlocker/webroot/cgi-bin/api.sh');
                
                if (shell !== null && shell.errno === 0) {
                    const output = shell.stdout.split('\\n\\n');
                    if (output.length > 1) {
                        appsObj = JSON.parse(output[1]);
                    }
                } else {
                    let res = await fetch('/cgi-bin/api.sh?action=get_apps');
                    if (res.ok) {
                        appsObj = await res.json();
                    }
                }

                if (appsObj && appsObj.success) {
                    window.installedAppsList = appsObj.apps;
                    renderAppList();
                } else {
                    document.getElementById('appListContainer').innerText = "Failed to fetch apps.";
                }
            } catch (e) {
                document.getElementById('appListContainer').innerText = "Error loading apps.";
            }
        }

        window.onload = () => {
            loadConfig();
            fetchApps();
        };
    </script>
</body>
</html>
